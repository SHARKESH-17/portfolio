name: CI/CD Static Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI - Validate Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: List HTML files
        run: |
          echo "HTML files found:"
          find . -name "*.html" -not -path "./.git/*" -not -path "./node_modules/*"

      - name: Check index.html exists
        run: |
          if [ -f "index.html" ]; then
            echo "index.html found"
          else
            echo "ERROR: index.html not found"
            exit 1
          fi

      - name: Validate HTML syntax
        run: npx --yes htmlhint "**/*.html" --ignore "node_modules/**"

      - name: CI successful
        run: echo "All CI checks passed!"

  deploy:
    name: CD - Deploy to GitHub Pages
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
